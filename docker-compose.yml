version: "3.9"

services:
  db-mysql:
    image: mysql:8.0
    container_name: db-mysql-ordinario
    restart: always
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ake_canul_juan
    volumes:
      - ./mysql-data:/var/lib/mysql
    secrets:
      - mysql_root_password

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
